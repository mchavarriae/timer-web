<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mejenga</title>
    <link href='https://fonts.googleapis.com/css?family=Orbitron' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
        .app { width: min(960px, 94vw); text-align: center; padding: 24px 0; }
        h1 { font-weight: 700; letter-spacing: .5px; margin: 0 0 18px; font-size: clamp(20px, 3vw, 28px); opacity: .9; }
        #timer { margin: 10px auto 16px; width: clamp(220px, 40vw, 360px); height: clamp(120px, 18vw, 180px); border-radius: 20px; display: grid; place-items: center; font-family: 'Orbitron', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial; font-size: clamp(48px, 8vw, 84px); font-weight: 800; line-height: 1; background: radial-gradient(120% 120% at 0% 0%, #1f2937 0%, #0b1022 60%, #0b1022 100%); box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); user-select: none; }
        button { appearance: none; border: none; border-radius: 999px; padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer; background: linear-gradient(180deg, #22c55e, #16a34a); color: white; box-shadow: 0 8px 20px rgba(34,197,94,.35); transition: transform .08s ease, filter .2s ease, opacity .2s ease; margin: 6px; }
        button:hover { filter: brightness(1.05); }
        button:active { transform: translateY(1px) scale(.99); }
        button[disabled] { opacity: .6; cursor: not-allowed; }
        .container { margin-top: 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .column { background: rgba(255,255,255,.04); border-radius: 16px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
        .column h3 { margin-top: 0; letter-spacing: .4px; }
        input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #e2e8f0; }
        input::placeholder { color: #94a3b8; }
        ul { margin: 12px 0 0; padding-left: 18px; text-align: left; }
    </style>

</head>

<body>
<main class="app">
    <h1>La Mejenga</h1>
    <script src="NoSleep.min.js"></script>
    <div style="font-family: Orbitron; font-size: 52px; font-weight: 500;" id="timer">05:00</div>
    <button id="restartButton">Reiniciar</button>
    <h1 style=" font-size: 42px" id="currentName"></h1>
    <div style="margin: 16px 0;">
        <a href="desempate.html" style="color:#38bdf8; font-weight:600; text-decoration:none;">Ir a Desempate</a>
    </div>

    <div class="container">

        <div class="column">
            <h3>EQUIPO 1</h3>
            <form id="nameForm1">
                <input type="text" id="nameInput1" placeholder="Enter name" required>
                <button type="submit">Agregar</button>
            </form>
            <ul id="nameList1"></ul>
        </div>
        <div class="column">

            <h3>EQUIPO 2</h3>
            <form id="nameForm2">
                <input type="text" id="nameInput2" placeholder="Enter name" required>
                <button type="submit">Agregar</button>
            </form>
            <ul id="nameList2"></ul>

        </div>
    </div>

    <audio id="alarmSound" src="alarm.mp3"></audio>
    <script src="script.js"></script>
</main>
</body>

</html>
